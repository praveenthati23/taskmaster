options:
  substitutionOption: ALLOW_LOOSE

steps:

# ============================
# FRONTEND: Build & Push
# ============================
- name: 'gcr.io/cloud-builders/docker'
  args:
    [
      'build',
      '-t',
      'us-central1-docker.pkg.dev/still-primer-424112-t3/taskmaster-frontend/frontend:latest',
      'frontend/'
    ]

- name: 'gcr.io/cloud-builders/docker'
  args:
    [
      'push',
      'us-central1-docker.pkg.dev/still-primer-424112-t3/taskmaster-frontend/frontend:latest'
    ]


# ============================
# BACKEND: Build & Push
# ============================
- name: 'gcr.io/cloud-builders/docker'
  args:
    [
      'build',
      '-t',
      'us-central1-docker.pkg.dev/still-primer-424112-t3/taskmaster-backend/backend:latest',
      'backend/'
    ]

- name: 'gcr.io/cloud-builders/docker'
  args:
    [
      'push',
      'us-central1-docker.pkg.dev/still-primer-424112-t3/taskmaster-backend/backend:latest'
    ]


# ============================
# DEPLOY TO GKE (Autopilot)
# ============================
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      set -e

      echo ">>> Authenticating with GKE cluster"
      gcloud container clusters get-credentials taskmaster-cluster \
        --region=us-central1 \
        --project=still-primer-424112-t3

      echo ">>> Applying Kubernetes deployments"

      kubectl -n production set image deployment/frontend frontend=us-central1-docker.pkg.dev/still-primer-424112-t3/taskmaster-frontend/frontend:latest

      kubectl -n production set image deployment/backend backend=us-central1-docker.pkg.dev/still-primer-424112-t3/taskmaster-backend/backend:latest

      echo ">>> Rolling updates triggered successfully"


# ============================
# IMAGES BUILT BY THIS PIPELINE
# ============================
images:
  - 'us-central1-docker.pkg.dev/still-primer-424112-t3/taskmaster-frontend/frontend:latest'
  - 'us-central1-docker.pkg.dev/still-primer-424112-t3/taskmaster-backend/backend:latest'
