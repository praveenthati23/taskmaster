apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: production
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: us-central1-docker.pkg.dev/still-primer-424112-t3/taskmaster-backend/backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: taskmaster-secrets
                  key: host
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: taskmaster-secrets
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskmaster-secrets
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: taskmaster-secrets
                  key: database
            - name: DB_PORT
              value: "5432"
