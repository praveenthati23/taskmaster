worker_processes 1;


events { worker_connections 1024; }


http {
include mime.types;
server {
listen 80;
location / {
root /usr/share/nginx/html;
index index.html;
try_files $uri /index.html;
}
location /api/ {
proxy_pass http://backend:80/; # not used in container; ingress will route
proxy_set_header Host $host;
}
}
}
